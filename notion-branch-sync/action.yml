description: Sync the pushed branch (commit, PR count, CI status, changelog) to the
  shared Notion Branch Activity database
inputs:
  branches-db-id:
    description: UUID of the shared "Branch Activity" Notion database
    required: true
  notion-token:
    description: Notion integration token
    required: true
  project-block-id:
    default: ''
    description: Roadmap table-row block UUID (changelog sync on main/master only)
    required: false
name: Notion branch sync
runs:
  steps:
  - env:
      BRANCH_NAME: ${{ github.ref_name }}
      COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      COMMIT_SHA: ${{ github.sha }}
      COMMIT_TS: ${{ github.event.head_commit.timestamp }}
      GITHUB_TOKEN: ${{ github.token }}
      NOTION_BRANCHES_DB_ID: ${{ inputs.branches-db-id }}
      NOTION_PROJECT_BLOCK_ID: ${{ inputs.project-block-id }}
      NOTION_TOKEN: ${{ inputs.notion-token }}
      PYTHONPATH: ${{ github.action_path }}/..
      REPO_NAME: ${{ github.repository }}
    name: Sync branch to Notion
    run: python3 -m notion_sync.branch_sync
    shell: bash
  using: composite
