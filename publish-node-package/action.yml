description: Build and publish a scoped npm package to GitHub Packages (the private
  GHCR npm registry)
inputs:
  node-auth-token:
    description: "Token with packages:write scope \u2014 pass the workflow GITHUB_TOKEN,\
      \ never a plaintext PAT"
    required: true
  node-version:
    default: '22'
    description: Node.js version for the build environment
    required: false
  package-dir:
    description: Path to the package directory that holds package.json (e.g. packages/typescript/ui)
    required: true
  scope:
    default: '@chrysa'
    description: npm scope the package publishes under
    required: false
name: Publish Node package
runs:
  steps:
  - name: Set up Node.js
    uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
    with:
      node-version: ${{ inputs.node-version }}
      registry-url: https://npm.pkg.github.com
      scope: ${{ inputs.scope }}
  - name: Install dependencies
    run: npm install --no-audit --no-fund
    shell: bash
    working-directory: ${{ inputs.package-dir }}
  - name: Build (if a build script is present)
    run: npm run build --if-present
    shell: bash
    working-directory: ${{ inputs.package-dir }}
  - env:
      NODE_AUTH_TOKEN: ${{ inputs.node-auth-token }}
    name: Publish to GitHub Packages (idempotent)
    run: "name=$(node -p \"require('./package.json').name\")\nversion=$(node -p \"\
      require('./package.json').version\")\nif npm view \"${name}@${version}\" version\
      \ >/dev/null 2>&1; then\n  echo \"${name}@${version} is already published \u2014\
      \ skipping.\"\nelse\n  echo \"Publishing ${name}@${version}\u2026\"\n  npm publish\n\
      fi\n"
    shell: bash
    working-directory: ${{ inputs.package-dir }}
  using: composite
