---
name: CI

on:
    pull_request:
        branches:
            - main
            - develop
    push:
        branches:
            - main
            - feature/**
            - fix/**
            - release/**
            - develop
    workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
    pre-commit:
        name: Pre-commit checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: chrysa/github-actions/python-setup@v1.4.4
              with:
                  python-version: "3.14"

            - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
              env:
                  SKIP: no-commit-to-branch

    validate:
        name: Tests + action YAML validation
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: chrysa/github-actions/python-setup@v1.4.4
              with:
                  python-version: "3.14"

            - name: Install test dependencies
              run: "pip install --quiet --only-binary :all: pytest==8.4.2 pytest-mock==3.15.1 pyyaml==6.0.3"

            - name: Run test suite
              run: pytest

    release:
        name: Tag release
        needs: validate
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: Install GitVersion
              uses: gittools/actions/gitversion/setup@bc6623af8fc07d5a8903052dd46da33403eec8e8 # v4.5.0
              with:
                  versionSpec: 6.x

            - name: Determine version
              id: gitversion
              uses: gittools/actions/gitversion/execute@bc6623af8fc07d5a8903052dd46da33403eec8e8 # v4.5.0

            - name: Debug GitVersion outputs
              run: |
                  echo "semVer=${{ steps.gitversion.outputs.semVer }}"
                  echo "majorMinorPatch=${{ steps.gitversion.outputs.majorMinorPatch }}"
                  echo "preReleaseTag=${{ steps.gitversion.outputs.preReleaseTag }}"
                  echo "preReleaseLabelWithDash=${{ steps.gitversion.outputs.preReleaseLabelWithDash }}"
              shell: bash

            - name: Check if tag exists
              id: tag_check
              run: |
                  VERSION="v${{ steps.gitversion.outputs.majorMinorPatch }}"
                  if git rev-parse --quiet --verify "refs/tags/$VERSION" > /dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi
              shell: bash

            - name: Generate release notes
              if: steps.tag_check.outputs.exists == 'false'
              uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
              with:
                  config: cliff.toml
                  args: --unreleased --tag v${{ steps.gitversion.outputs.majorMinorPatch }} --strip all
              env:
                  OUTPUT: release_notes.md
                  GITHUB_REPO: ${{ github.repository }}

            - name: Tag release on mainline
              if: steps.tag_check.outputs.exists == 'false'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  VERSION="v${{ steps.gitversion.outputs.majorMinorPatch }}"
                  MAJOR="v${{ steps.gitversion.outputs.major }}"
                  # Tag the pushed commit (already on main) and push ONLY the tags — never a
                  # commit to the protected main branch. The old flow created a CHANGELOG
                  # commit and did `git push HEAD:main --follow-tags`; the push to protected
                  # main was rejected but the tag still landed on that off-mainline commit,
                  # wedging GitVersion at the next bump. The changelog is regenerated on
                  # demand (make changelog) and captured in the GitHub Release notes below.
                  git tag -a "$VERSION" -m "Release $VERSION"
                  git push origin "refs/tags/$VERSION"
                  git tag -fa "$MAJOR" -m "Latest v${{ steps.gitversion.outputs.major }}"
                  git push origin "refs/tags/$MAJOR" --force
              shell: bash

            - name: Create GitHub Release
              if: steps.tag_check.outputs.exists == 'false'
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
              with:
                  tag_name: v${{ steps.gitversion.outputs.majorMinorPatch }}
                  name: v${{ steps.gitversion.outputs.majorMinorPatch }}
                  body_path: release_notes.md
                  make_latest: true
