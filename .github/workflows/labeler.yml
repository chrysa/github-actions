# pull_request_target gives a token that can write labels on Dependabot and fork
# pull requests too. It is safe here: there is no checkout step and the labeler reads
# .github/labeler.yml through the API at github.sha, which is the base branch commit
# for this event. No pull request code is fetched or run.
# A caller of this reusable workflow must grant the same permissions to its job:
# a reusable workflow cannot raise the caller's token permissions.
"on":
  pull_request_target: null
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: labeler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  labels:
    name: Apply labels on pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        sync-labels: true
