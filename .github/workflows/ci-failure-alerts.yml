name: CI failure alerts
"on":
  schedule:
  - cron: "*/30 * * * *"
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-failure-alerts
  cancel-in-progress: false
jobs:
  alert:
    name: Post failed runs to Discord
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Restore alert state
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ci-failure-alerts
        key: ci-failure-alerts-state-${{ github.run_id }}
        restore-keys: ci-failure-alerts-state-
    - name: Find failed runs and post them
      env:
        GH_TOKEN: ${{ secrets.CI_ALERTS_READ_TOKEN || github.token }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_ALERTES_CI }}
        ALERT_OWNER: chrysa
        ALERT_BRANCHES: main,develop
      run: python3 scripts/ci_failure_alerts.py
    - name: Save alert state
      if: always() && hashFiles('.ci-failure-alerts/state.json') != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ci-failure-alerts
        key: ci-failure-alerts-state-${{ github.run_id }}
